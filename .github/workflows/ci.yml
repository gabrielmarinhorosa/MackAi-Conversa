name: ci

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mackai
          POSTGRES_PASSWORD: mackai
          POSTGRES_DB: conversas_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mackai -d conversas_test"
          --health-interval 2s --health-retries 15
    env:
      TEST_DATABASE_URL: postgresql://mackai:mackai@localhost:5432/conversas_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
      - name: Contrato OpenAPI atualizado
        run: |
          python scripts/exportar_openapi.py
          git diff --exit-code contracts/

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  imagem:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t mackai-conversas .
