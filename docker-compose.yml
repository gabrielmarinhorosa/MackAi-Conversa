# Ambiente local só do Conversas: PostgreSQL + Orquestrador falso + Módulo 1 falso + este serviço.
# O compose com os três serviços reais fica no repositório do grupo (seção 11 do documento do Orquestrador).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: mackai
      POSTGRES_PASSWORD: mackai
      POSTGRES_DB: conversas_db
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mackai -d conversas_db"]
      interval: 2s
      retries: 15

  orquestrador:
    build:
      context: dev
      dockerfile: Dockerfile.orquestrador-falso
    ports: ["8001:8000"]

  modulo1:
    build:
      context: dev
      dockerfile: Dockerfile.modulo1-falso
    ports: ["8002:8000"]

  conversas:
    build:
      context: .
      args:  # o navegador chama o Módulo 1 falso pela porta publicada no host
        VITE_MOD1_AUTH_URL: http://localhost:8002
        VITE_MOD1_PROJECTS_URL: http://localhost:8002
    environment:
      DATABASE_URL: postgresql://mackai:mackai@postgres:5432/conversas_db
      ORQUESTRADOR_URL: http://orquestrador:8000
      MOD1_AUTH_URL: http://modulo1:8000
      MOD1_PROJECTS_URL: http://modulo1:8000
      MOD1_JWT_ISSUER: mod1-auth-local
    ports: ["8000:8000"]
    depends_on:
      postgres:
        condition: service_healthy
      orquestrador:
        condition: service_started
      modulo1:
        condition: service_started
